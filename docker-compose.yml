services:
  trading-journal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-journal
    restart: unless-stopped
    ports:
      # Local-only by default. Set HOST_BIND_ADDRESS=0.0.0.0 only when
      # trusted devices on the local network must reach the journal.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      - PORT=8000
      - DB_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - JOURNAL_USERNAME=${JOURNAL_USERNAME:-}
      - JOURNAL_PASSWORD=${JOURNAL_PASSWORD:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
