services:
  trading-journal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-journal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Memory limits strictly tuned for Raspberry Pi 3 Model B (1 GB RAM total)
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 80M
