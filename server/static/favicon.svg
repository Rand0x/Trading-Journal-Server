<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container with rounded corners and border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Candlestick 1: Bearish/Pullback (Left) -->
  <line x1="16" y1="24" x2="16" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <rect x="13" y="28" width="6" height="13" rx="1.5" fill="#ef4444"/>

  <!-- Candlestick 2: Bullish (Middle) -->
  <line x1="32" y1="16" x2="32" y2="44" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="21" width="6" height="17" rx="1.5" fill="#10b981"/>

  <!-- Candlestick 3: Strong Bullish Breakout (Right) -->
  <line x1="48" y1="10" x2="48" y2="36" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="45" y="14" width="6" height="15" rx="1.5" fill="#10b981"/>

  <!-- Glowing Trend / Equity Curve Line -->
  <path d="M 12 46 L 24 35 L 34 39 L 52 14" fill="none" stroke="url(#trendGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Breakout Apex Node -->
  <circle cx="52" cy="14" r="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="52" cy="14" r="2" fill="#ffffff"/>
</svg>
